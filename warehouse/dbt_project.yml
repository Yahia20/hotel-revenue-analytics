name: hotel_revenue
version: "1.0.0"
config-version: 2
profile: hotel_revenue

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Data window as published. Any arrival outside it means the load went wrong.
  first_arrival: "2015-07-01"
  last_arrival: "2017-08-31"
  # ADR above this is treated as a keying error (the dataset has one 5,400 EUR night; the next highest is 510).
  adr_ceiling: 1000

models:
  hotel_revenue:
    staging:
      +materialized: table
    marts:
      +materialized: table
